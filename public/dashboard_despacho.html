<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despacho · Acajutla</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1420; --panel:#111f31; --panel2:#16273c; --line:#22374f;
  --tx:#e9f0f9; --mut:#8299b6; --amber:#f5b544; --green:#35c07a; --blue:#4cc9f0;
  box-sizing:border-box;
}
*{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);
  color:var(--tx);font-variant-numeric:tabular-nums;overflow:hidden}
#app{display:grid;grid-template-columns:360px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.head .sub{color:var(--mut);font-size:12px;letter-spacing:.3px}
.head h1{font-size:23px;font-weight:600;margin-top:2px}
.clockwrap{padding:20px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),transparent)}
.clock{font-size:52px;font-weight:600;line-height:1;letter-spacing:1px}
.clock small{font-size:16px;color:var(--mut);font-weight:400}
.pct{margin-top:12px;height:8px;border-radius:6px;background:#0c1a29;overflow:hidden}
.pct > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#7ff0b5);
  border-radius:6px;transition:width .25s}
.pctlabel{display:flex;justify-content:space-between;margin-top:8px;
  font-size:13px;color:var(--mut)}
.pctlabel b{color:var(--tx);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border-bottom:1px solid var(--line)}
.kpi{background:var(--panel);padding:14px 18px}
.kpi .v{font-size:26px;font-weight:600}
.kpi .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.kpi .v.amber{color:var(--amber)}
.routes{flex:1;overflow-y:auto;padding:10px 14px}
.routes h2{font-size:11px;color:var(--mut);font-weight:500;
  padding:6px 8px 10px}
.route{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;
  padding:9px 8px;border-radius:8px}
.route:hover{background:var(--panel2)}
.route .dot{width:10px;height:10px;border-radius:50%}
.route .nm{font-size:13px;font-weight:500}
.route .meta{font-size:11px;color:var(--mut);margin-top:2px}
.route .bar{height:5px;background:#0c1a29;border-radius:4px;margin-top:6px;overflow:hidden}
.route .bar > i{display:block;height:100%;width:0;border-radius:4px}
.route .cnt{font-size:12px;color:var(--mut);white-space:nowrap}
.route.done .cnt{color:var(--green)}
.route.done .nm::after{content:" ✓";color:var(--green)}
.controls{padding:14px 18px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;background:var(--panel2)}
button#play{flex:1;background:var(--amber);color:#20160a;border:none;
  padding:12px;border-radius:10px;font-family:inherit;font-size:14px;
  font-weight:600;cursor:pointer}
button#play:hover{filter:brightness(1.06)}
button#reset{background:transparent;color:var(--mut);border:1px solid var(--line);
  padding:12px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px}
.speed{display:flex;gap:4px}
.speed b{color:var(--mut);font-size:11px;align-self:center;margin-right:2px}
.speed button{background:#0c1a29;color:var(--mut);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.speed button.on{background:var(--blue);color:#04121a;border-color:var(--blue);font-weight:600}
.times{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tkpi{background:var(--panel);padding:16px 18px}
.tk-v{font-size:27px;font-weight:600;letter-spacing:.5px}
.tk-v.amber{color:var(--amber)}
.tk-l{font-size:11.5px;color:var(--mut);margin-top:3px}
.tk-h{font-size:15px;color:var(--tx);font-weight:600;margin-top:3px}
.ministats{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:center;padding:12px;border-bottom:1px solid var(--line);color:var(--mut);font-size:13px}
.ministats b{color:var(--tx);font-weight:600;font-size:15px}
.ministats .sep{opacity:.4}
.mapwrap{position:relative;height:100%}
#map{height:100%}
.done-banner{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  z-index:600;background:var(--green);color:#04160c;padding:10px 20px;border-radius:30px;
  font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:none}
.veh{width:14px;height:14px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 14px 2px currentColor}
.leaflet-container{background:#0b1420}
.leaflet-tile-pane{filter:brightness(.5) saturate(.72) contrast(1.05)}
@media(max-width:820px){
  #app{display:block;height:100dvh}
  .mapwrap{position:fixed;inset:0;z-index:0;height:100dvh}
  #side{position:fixed;top:0;left:0;right:0;z-index:10;display:block;
    max-height:72vh;overflow:auto;border:none;border-radius:0 0 18px 18px;
    background:rgba(11,20,32,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    box-shadow:0 12px 34px rgba(0,0,0,.45);
    padding-top:env(safe-area-inset-top);padding-bottom:12px}
  .head{padding:10px 16px 4px;border:none}
  .head h1{font-size:18px} .head .sub{font-size:10.5px}
  .clockwrap{padding:2px 16px 10px;border:none;background:transparent}
  .clock{font-size:36px}
  .times{margin:0 12px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .tkpi{padding:11px 12px}
  .tk-v{font-size:22px;letter-spacing:0}
  .tk-l{font-size:11px} .tk-h{font-size:14px}
  .ministats{border:none;padding:8px 10px 2px;font-size:12px}
  .routes{display:none}
  .controls{position:fixed;left:0;right:0;bottom:0;z-index:12;border-top:1px solid var(--line);
    background:rgba(17,31,49,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  button#play{padding:16px;font-size:16px}
  button#reset{padding:16px 14px}
}
</style>
</head>

    <div class="controls">

  </aside>
  <div class="mapwrap"><div id="map"></div>
    <div class="done-banner" id="banner"></div></div>
</div>

  let lo=0,hi=c.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(c[mid]<frac)lo=mid+1;else hi=mid;}
  const i=Math.max(1,lo),f=(frac-c[i-1])/((c[i]-c[i-1])||1);
  return [p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f];}

let sim=0,playing=false,last=0,speed=8;
const maxT=Math.max(...D.rutas.map(r=>r.t_uso));
function fracAt(r,t){const kf=r.kf;
  if(t<=0)return 0; if(t>=kf[kf.length-1][0])return 1;
  let lo=0,hi=kf.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(kf[mid][0]<t)lo=mid+1;else hi=mid;}
  const i=Math.max(1,lo),a=kf[i-1],b=kf[i],f=(t-a[0])/((b[0]-a[0])||1);
  return a[1]+(b[1]-a[1])*f;}

function frame(ts){
  if(!playing)return; if(!last)last=ts;
  sim+=((ts-last)/1000)*speed; last=ts;
  if(sim>=maxT){sim=maxT;playing=false;play.textContent='▶ Iniciar despacho';
    banner.style.display='block';
    banner.innerHTML='Última entrega '+reloj(D.t_entrega)+' ('+fmt(D.t_entrega)+') &nbsp;·&nbsp; regreso '+reloj(D.t_uso)+' ('+fmt(D.t_uso)+')';}
  render(); if(playing)requestAnimationFrame(frame);
}
function render(){
  clock.textContent=reloj(sim);
  let entregados=0;
  D.rutas.forEach((r,ri)=>{
    r._veh.setLatLng(posAt(r,fracAt(r,sim)));
    let done=0;
    r.stops.forEach((s,si)=>{
      if(sim>=s.t){done++;entregados++;
        r._stopEls[si].setStyle({fillColor:'#35c07a',color:'#0b1420'});}
    });
    const pr=r.stops.length?done/r.stops.length:1;
    rows[ri].bar.style.width=(pr*100)+'%';
    rows[ri].cnt.textContent=done+'/'+r.stops.length;
    rows[ri].el.classList.toggle('done',done===r.stops.length&&r.stops.length>0);
  });
  const pct=D.n_centros?Math.round(entregados/D.n_centros*100):0;
  pctbar.style.width=pct+'%'; pctnum.textContent=pct+'%';
  entregadosEl.textContent=entregados+' de '+D.n_centros+' centros';
}
const entregadosEl=document.getElementById('entregados');

play.onclick=()=>{ if(sim>=maxT)reset();
  playing=!playing; last=0;
  play.textContent=playing?'⏸ Pausar':'▶ Reanudar';
  if(playing){banner.style.display='none';requestAnimationFrame(frame);} };
function reset(){playing=false;sim=0;last=0;play.textContent='▶ Iniciar despacho';
  banner.style.display='none';
  D.rutas.forEach(r=>r._stopEls.forEach(m=>m.setStyle({fillColor:'#6b7f99',color:'#0b1420'})));
  render();}
document.getElementById('reset').onclick=reset;
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); speed=+b.dataset.s;});
render();
</script>
</body>
