<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba 1 · Repetición y evaluación de la entrega</title>

<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1b33;--ink2:#56627a;--mute:#94a0b5;--line:#e6eaf1;--navy:#0b2a5b;--blue:#2563eb;--ok:#12a150;--amb:#e8a100;--red:#e0364f;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line)}
header .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:grid;place-items:center;flex:none}
header h1{margin:0;font-size:19px;letter-spacing:-.01em}header small{color:var(--ink2)}
header .r{margin-left:auto;display:flex;gap:10px;align-items:center}
select.ru{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:600;min-width:220px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px 22px}
.k{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.k .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px}
.k b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.k span{color:var(--ink2);font-size:12px}
.main{display:grid;grid-template-columns:1fr 430px;gap:14px;padding:0 22px 22px}
.mapw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-height:640px}
#map{flex:1;min-height:480px;background:#eef1f6}
.player{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 16px -6px rgba(37,99,235,.7)}
.clock{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;min-width:86px}
.clock small{display:block;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.06em}
#slider{flex:1;min-width:200px;accent-color:var(--blue)}
.spd{display:flex;gap:4px;flex-wrap:wrap}
.spd button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-weight:700;font-size:12px;cursor:pointer}
.spd button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.opts{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--ink2);padding:0 14px 12px;flex-wrap:wrap}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.leg{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.leg i{display:inline-block;width:22px;height:0;border-top:3px solid var(--ink2);vertical-align:middle;margin-right:5px}
.leg i.d{border-top-style:dashed}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 210px);min-height:640px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex:1;border:0;background:none;padding:13px 6px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;font-size:13px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.pane{overflow:auto;padding:14px 16px 20px;flex:1}
h3{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 0 10px}
h3:first-child{margin-top:2px}
.hz{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#f7f9fc;border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.hz .e{font-size:17px;line-height:1.2}
.rc{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.rc:hover{border-color:#bfd0f5}.rc.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.rc .h{display:flex;align-items:center;gap:8px}
.tag{font-weight:800;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
.rc .h b{font-size:14px}.rc .h small{margin-left:auto;color:var(--mute);font-size:11.5px;text-align:right}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mets div{background:#f7f9fc;border-radius:10px;padding:7px 8px}.mets b{display:block;font-size:14.5px}.mets span{font-size:11px;color:var(--ink2)}
.cov{height:6px;background:#edf0f5;border-radius:6px;overflow:hidden;margin-top:8px}.cov i{display:block;height:100%;border-radius:6px}
.det table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.det th{text-align:left;color:var(--mute);font-weight:600;font-size:11px;padding:4px 4px;border-bottom:1px solid var(--line)}
.det td{padding:6px 4px;border-bottom:1px solid #f0f2f6;vertical-align:top}
.pos{color:var(--red);font-weight:700}.neg{color:var(--ok);font-weight:700}
.nov{font-size:11.5px;color:var(--ink2)}
.ev{display:flex;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}.ev time{font-weight:700;min-width:44px;color:var(--ink2)}
.gantt{position:relative}
.gr{display:flex;align-items:center;gap:8px;height:30px;cursor:pointer}
.gr .n{width:44px;font-weight:800;font-size:12px;flex:none}
.gr .b{position:relative;flex:1;height:18px;background:#f3f5f9;border-radius:6px}
.gr .b i{position:absolute;top:0;bottom:0;border-radius:4px}
.gr .b .gap{background:repeating-linear-gradient(45deg,#cfd6e3 0 3px,#eef1f6 3px 6px)}
.gr .b .st{background:#0f1b33;opacity:.85}
.gr .b .dm{position:absolute;top:-3px;width:8px;height:8px;transform:rotate(45deg);background:#12a150;border:1.5px solid #fff;margin-left:-4px;top:5px}
.gr.sel .n{color:var(--blue)}
.gax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);padding-left:52px;margin-top:4px}
.gph{position:absolute;top:0;bottom:16px;width:2px;background:var(--red);pointer-events:none}
.sedes td:first-child{font-weight:600}
.veh{display:flex;align-items:center;gap:4px;font-weight:800;font-size:11.5px;color:#fff;padding:3px 8px;border-radius:999px;border:2px solid #fff;box-shadow:0 3px 10px rgba(15,27,51,.3);white-space:nowrap;transform:translate(-50%,-50%)}
.veh.sin{opacity:.6;border-style:dashed}
.veh.fin{opacity:.38;transform:translate(-50%,-50%) scale(.82);box-shadow:none;filter:saturate(.4)}
.sd{border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(15,27,51,.3);transition:background .3s,transform .3s}
.sd.ok{transform:scale(1.15)}
.lbl{background:transparent;border:0;box-shadow:none;font-weight:700;font-size:11.5px;color:#26324a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.lbl::before{display:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:700;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:12.5px;box-shadow:0 6px 18px -8px rgba(15,27,51,.35)}
.toast:empty{display:none}
.feed{position:absolute;right:12px;top:12px;z-index:650;display:flex;flex-direction:column;gap:6px;max-width:300px}
.feed div{background:#fff;border-radius:10px;padding:7px 11px;font-size:12px;box-shadow:0 4px 14px -6px rgba(15,27,51,.35);border-left:4px solid var(--ok);animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateX(10px)}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.main{grid-template-columns:1fr}.side{max-height:none;min-height:0}}
@media(max-width:640px){
  header{flex-wrap:wrap;padding:12px 14px;gap:10px}header h1{font-size:16px}header .r{margin-left:0;width:100%}select.ru{width:100%;min-width:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 12px}.k{padding:10px;gap:8px}.k .ic{width:32px;height:32px;font-size:16px}.k b{font-size:18px}
  .main{padding:0 12px 16px;gap:10px}.mapw{min-height:0}#map{min-height:52vh;flex:none;height:52vh}
  .player{gap:8px;padding:10px}.clock{font-size:18px;min-width:70px}#slider{order:5;flex-basis:100%}
  .feed{display:none}.mets{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

    const m = L.marker([s.lat, s.lng], { icon: el, zIndexOffset: 500 }).addTo(gS);
    if (SEL || map.getZoom() >= 9) m.bindTooltip(esc(s.sede), { permanent: true, direction: 'bottom', offset: [0, z / 2], className: 'lbl' });
    m.bindPopup(() => { const p = x && x.p; return `<b>${esc(s.sede)}</b> · ${s.tipo}<br>${x ? `${x.r.id} · ${esc(x.r.veh)}<br>Entregado ${hm(p.hecho)} (plan ${hm(p.plan)})${p.dwell != null ? '<br>En sede ~' + p.dwell + ' min' : ''}` : 'Sin ruta'}`; });

map.on('zoomend', () => { if (!SEL) dibujarSedes(); pintarSedes(T); });

/* ---------- reproducción ---------- */
const T_MIN = Math.min(...RS.map((r) => r.ini)) - 10 * 60, T_MAX = Math.max(...RS.map((r) => r.t1)) + 10 * 60;
let T = T_MIN, PLAY = false, SPD = 128, last = 0;
const SPEEDS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512];
$('#spd').innerHTML = SPEEDS.map((v) => `<button data-s="${v}" class="${v === SPD ? 'on' : ''}">${v}x</button>`).join('');
$('#slider').max = T_MAX - T_MIN;
const vmk = {}, trail = {};
function posEn(r, t) {
  if (!r.seg.length) return null;

  if (t >= r.t1) { const s = r.seg[r.seg.length - 1]; return { ll: s.c[s.c.length - 1], fin: true, rec: false }; }
  let lo = 0, hi = r.seg.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (r.seg[m].t1 < t) lo = m + 1; else hi = m; }
  const s = r.seg[lo], f = s.t1 > s.t0 ? (t - s.t0) / (s.t1 - s.t0) : 1, d = f * s.len;
  let i = 1; while (i < s.cum.length - 1 && s.cum[i] < d) i++;
  const a = s.c[i - 1], b = s.c[i], k = s.cum[i] > s.cum[i - 1] ? (d - s.cum[i - 1]) / (s.cum[i] - s.cum[i - 1]) : 0;
  return { ll: [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k], rec: s.rec, idx: lo, i, };
}
function camino(r, t) {
  const p = posEn(r, t); if (!p) return [];
  const out = [];
  const n = p.fin ? r.seg.length : p.idx;
  for (let j = 0; j < n; j++) { const c = r.seg[j].c; out.push(...(out.length ? c.slice(1) : c)); }
  if (!p.fin) { const c = r.seg[p.idx].c.slice(0, p.i); out.push(...(out.length ? c.slice(1) : c), p.ll); }

}
function frame(t) {

  $('#clk').textContent = hm(T);
  RS.forEach((r) => {
    if (!vis(r)) { if (vmk[r.id]) { gV.removeLayer(vmk[r.id]); delete vmk[r.id]; } if (trail[r.id]) { gTrail.removeLayer(trail[r.id]); delete trail[r.id]; } return; }
    const p = posEn(r, T);
    if (!p) { if (vmk[r.id]) { gV.removeLayer(vmk[r.id]); delete vmk[r.id]; } if (trail[r.id]) trail[r.id].setLatLngs([]); return; }
    // ruta finalizada (ya entregó en todas sus sedes): se atenúa para que resalte lo que sigue en curso
    const termino = T >= r.ultEntrega;
    const html = `<div class="veh${p.rec && !termino ? ' sin' : ''}${termino ? ' fin' : ''}" style="background:${r.col}">🚚 ${r.id}${termino ? ' ✓' : ''}</div>`;
    if (!vmk[r.id]) vmk[r.id] = L.marker(p.ll, { icon: L.divIcon({ className: '', html, iconSize: [0, 0] }), zIndexOffset: 1000 }).addTo(gV).on('click', () => elegir(r.id));
    else { vmk[r.id].setLatLng(p.ll); const el = vmk[r.id].getElement(); if (el && el.innerHTML !== html) el.innerHTML = html; }
    vmk[r.id].setZIndexOffset(termino ? 200 : 1000);
    const cam = camino(r, T), est = termino ? { opacity: 0.22, weight: 3 } : { opacity: 0.9, weight: 4 };
    if (!trail[r.id]) trail[r.id] = L.polyline(cam, { color: r.col, ...est, interactive: false }).addTo(gTrail);
    else { trail[r.id].setLatLngs(cam); trail[r.id].setStyle(est); }
    if (!termino) trail[r.id].bringToFront();
  });
  pintarSedes(T);
  if (SEL && $('#seguir').checked && PLAY) { const r = RS.find((x) => x.id === SEL), p = posEn(r, T); if (p && !map.getBounds().pad(-0.2).contains(p.ll)) map.panTo(p.ll, { animate: true, duration: 0.6 }); }
  const ph = document.querySelector('.gph'); if (ph) ph.style.left = `calc(52px + (100% - 52px) * ${(T - G0) / (G1 - G0)})`;
}
let yaAvisado = {};
function pintarSedes(t) {
  Object.values(sedeMk).forEach(({ m, x }) => {
    const el = m.getElement(); if (!el || !x) return;
    const d = el.firstChild, hecho = x.p.hecho && x.p.hecho <= t, cam = !hecho && x.p.salio && x.p.salio <= t;
    const rutaFin = t >= x.r.ultEntrega;
    d.style.background = hecho ? (rutaFin ? '#8fd3ab' : '#12a150') : cam ? '#e8a100' : '#b8c2d3';
    d.classList.toggle('ok', !!hecho);
    if (hecho && PLAY && !yaAvisado[x.p.sede] && t - x.p.hecho < 900) { yaAvisado[x.p.sede] = 1; aviso(`<b>${hm(x.p.hecho)}</b> · ${esc(x.r.id)} entregó en <b>${esc(x.p.sede)}</b>`, x.r.col); }
  });
}
function aviso(h, col) { const f = $('#feed'), d = document.createElement('div'); d.innerHTML = h; d.style.borderLeftColor = col; f.prepend(d); while (f.children.length > 4) f.lastChild.remove(); setTimeout(() => d.remove(), 6000); }
function loop(ts) {
  if (PLAY) {
    const dt = last ? (ts - last) / 1000 : 0; last = ts;
    frame(T + dt * SPD);
    if (T >= T_MAX) { PLAY = false; icono(); }
  } else last = 0;
  requestAnimationFrame(loop);
}
function icono() { $('#ipl').innerHTML = PLAY ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; }
$('#play').onclick = () => { if (T >= T_MAX) { T = T_MIN; yaAvisado = {}; } PLAY = !PLAY; last = 0; icono(); };
$('#slider').oninput = (e) => { yaAvisado = {}; RS.forEach((r) => r.paradas.forEach((p) => { if (p.hecho && p.hecho < T_MIN + +e.target.value) yaAvisado[p.sede] = 1; })); frame(T_MIN + +e.target.value); };
$('#spd').onclick = (e) => { const b = e.target.closest('[data-s]'); if (!b) return; SPD = +b.dataset.s; document.querySelectorAll('#spd button').forEach((x) => x.classList.toggle('on', x === b)); };
$('#traza').onchange = dibujarTrazas;

/* ---------- filtro ---------- */
$('#fr').innerHTML = '<option value="">🗺️ Todas las rutas</option>' + RS.map((r) => `<option value="${r.id}">${r.id} · ${esc(r.veh)} · ${esc(r.paradas.map((p) => p.sede).join(', '))}</option>`).join('');
$('#fr').onchange = (e) => elegir(e.target.value);
function elegir(id) {
  SEL = SEL === id && id ? '' : id; $('#fr').value = SEL;
  dibujarTrazas(); dibujarSedes(); frame(T);
  if (SEL) {
    const r = RS.find((x) => x.id === SEL);
    const b = L.latLngBounds(r.paradas.map((p) => [p.lat, p.lng]).concat([D.cn])); r.pts.forEach((p) => b.extend([p[1], p[2]]));
    map.fitBounds(b, { padding: [40, 40] });
    if (T < r.ini - 600 || T > r.t1) frame(r.ini - 300);
    if (tab === 'res') tab = 'rut';
  } else map.fitBounds(todo, { padding: MOVIL ? [16, 16] : [30, 30] });
  pintarTabs(); pintarPane();
}

/* ---------- KPIs ---------- */
const P = RS.flatMap((r) => r.paradas.map((p) => ({ ...p, r })));
const prom = (a) => { a = a.filter((x) => x != null && isFinite(x)); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
(function kpis() {
  const paq = P.reduce((s, p) => s + p.paqh, 0), tot = P.reduce((s, p) => s + p.paq, 0);
  const km = RS.reduce((s, r) => s + r.km, 0), vm = prom(RS.filter((r) => r.cob >= 50).map((r) => r.vmov)), dw = prom(P.map((p) => p.dwell));
  const cob = prom(RS.map((r) => r.cob));
  const ult = Math.max(...P.map((p) => p.hecho)), pri = Math.min(...RS.map((r) => r.ini));
  const k = (ic, bg, v, l) => `<div class="k"><div class="ic" style="background:${bg}">${ic}</div><div><b>${v}</b><span>${l}</span></div></div>`;
  $('#kpis').innerHTML = k('📦', '#e8f7ee', `${paq}/${tot}`, 'paquetes entregados') + k('🕗', '#eaf1ff', `${hm(pri)} → ${hm(ult)}`, 'primera salida → última entrega') +
    k('🛣️', '#fff4e0', Math.round(km).toLocaleString('es-SV') + ' km', 'recorridos con GPS (16 rutas)') + k('⚡', '#f2ecff', Math.round(vm) + ' km/h', 'velocidad promedio en movimiento') +
    k('⏱️', '#e6f7fb', Math.round(dw) + ' min', 'tiempo promedio en cada sede') + k('📡', '#fdecef', Math.round(cob) + ' %', 'cobertura GPS promedio');
})();

/* ---------- panel ---------- */
let tab = 'res';
function pintarTabs() { document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab)); }
document.querySelector('.tabs').onclick = (e) => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; pintarTabs(); pintarPane(); };
const G0 = Math.floor(T_MIN / 3600) * 3600, G1 = Math.ceil(T_MAX / 3600) * 3600;
const gx = (t) => ((t - G0) / (G1 - G0) * 100).toFixed(2) + '%';
function rutaCard(r) {
  const dwell = prom(r.paradas.map((p) => p.dwell)), atr = prom(r.paradas.map((p) => p.atraso));
  const ult = Math.max(...r.paradas.map((p) => p.hecho));
  const cc = r.cob >= 90 ? '#12a150' : r.cob >= 60 ? '#e8a100' : '#e0364f';
  const tel = r.disp.split('·').slice(1).join('·').trim() || r.disp;
  const sel = SEL === r.id;
  let h = `<div class="rc${sel ? ' sel' : ''}" data-r="${r.id}"><div class="h"><span class="tag" style="background:${r.col}">${r.id}</span><b>${esc(r.veh)}</b><small>${esc(r.resp)}<br>${esc(tel)}</small></div>
    <div class="mets"><div><b>${hm(r.ini)}</b><span>salida CNPRE</span></div><div><b>${hm(ult)}</b><span>última entrega</span></div><div><b>${dur((ult - r.ini) / 60)}</b><span>hasta la última sede</span></div>
    <div><b>${r.km} km</b><span>GPS (plan ${r.plankm} ida/vuelta)</span></div><div><b>${r.vmov != null && r.cob >= 30 ? r.vmov + ' km/h' : '—'}</b><span>vel. en movimiento</span></div><div><b>${r.vmax != null && r.cob >= 30 ? r.vmax + ' km/h' : '—'}</b><span>vel. alta (p95)</span></div>
    <div><b>${dwell != null ? Math.round(dwell) + ' min' : '—'}</b><span>prom. en sede</span></div><div><b class="${atr > 15 ? 'pos' : atr < -5 ? 'neg' : ''}">${atr != null ? (atr > 0 ? '+' : '') + Math.round(atr) + ' min' : '—'}</b><span>atraso prom. vs plan</span></div><div><b>${r.batIni != null ? r.batIni + '→' + r.batFin + ' %' : '—'}</b><span>batería</span></div></div>
    <div class="cov"><i style="width:${r.cob}%;background:${cc}"></i></div><div style="font-size:11.5px;color:var(--ink2);margin-top:4px">Cobertura GPS ${r.cob}% · ${r.npts} puntos${r.gaps.length ? ' · ' + r.gaps.length + ' hueco' + (r.gaps.length > 1 ? 's' : '') + ' ≥10 min' : ''} · cierre ${r.manual ? 'por coordinación' : 'por el motorista'} ${hm(r.llegMarc)}</div>`;
  if (sel) {
    h += `<div class="det"><table><tr><th>Sede</th><th>Plan</th><th>Real</th><th>Atraso</th><th>En sede</th><th>Marcó a</th></tr>` + r.paradas.map((p) => `<tr><td>${esc(p.sede)}${p.nov ? `<div class="nov">${esc(p.nov)}</div>` : ''}</td><td>${hm(p.plan)}</td><td><b>${hm(p.hecho)}</b></td><td class="${p.atraso > 15 ? 'pos' : p.atraso < -5 ? 'neg' : ''}">${p.atraso != null ? (p.atraso > 0 ? '+' : '') + p.atraso : '—'}</td><td>${p.dwell != null ? p.dwell + ' min' : '—'}</td><td>${p.dist != null ? p.dist + ' m' : '—'}</td></tr>`).join('') + `</table></div>
      <h3>Bitácora</h3>` + r.eventos.map((e) => `<div class="ev"><time>${hm(e[0])}</time><div><b>${esc(e[1])}</b>${e[2] ? ' · ' + esc(e[2]) : ''}${e[3] && !/^E\d\d ·/.test(e[3]) ? `<div class="nov">${esc(e[3])}</div>` : ''}</div></div>`).join('') +
      (r.gaps.length ? `<h3>Huecos de GPS (≥10 min)</h3>` + r.gaps.map((g) => `<div class="ev"><time>${hm(g[0])}</time><div>${dur(g[2])} sin señal · avanzó ${g[3]} km en línea recta</div></div>`).join('') : '');
  }
  return h + '</div>';
}
function hallazgos() {

  const tot = P.reduce((s, p) => s + p.paq, 0), ent = P.reduce((s, p) => s + p.paqh, 0);
  add('✅', `<b>${ent} de ${tot} paquetes entregados</b> en las ${P.length} sedes; las 16 rutas quedaron cerradas.`);
  const ios = RS.filter((r) => /iPhone/.test(r.disp)), apk = RS.filter((r) => /^APK/.test(r.disp));
  add('📱', `<b>Cobertura GPS: APK ${Math.round(prom(apk.map((r) => r.cob)))} % vs iPhone (web) ${Math.round(prom(ios.map((r) => r.cob)))} %.</b> Los iPhone (${ios.map((r) => r.id).join(', ')}) dejaron de transmitir con la pantalla bloqueada; sus tramos aparecen reconstruidos por carretera.`);
  const baja = RS.filter((r) => r.cob < 80 && !/iPhone/.test(r.disp));
  if (baja.length) add('📡', `Android con cobertura baja: ${baja.map((r) => `<b>${r.id}</b> ${r.cob}% (${esc(r.disp.split('·')[1] || '')})`).join(', ')}. Revisar ahorro de batería / segundo plano en esos modelos.`);
  const atr = P.filter((p) => p.atraso != null).sort((a, b) => b.atraso - a.atraso);
  add('⏰', `Atraso promedio contra el plan: <b>${Math.round(prom(atr.map((p) => p.atraso)))} min</b>. Mayores: ${atr.slice(0, 3).map((p) => `${esc(p.sede)} (${p.r.id}) +${p.atraso}`).join(', ')}. Adelantadas: ${atr.slice(-2).map((p) => `${esc(p.sede)} ${p.atraso}`).join(', ')} min.`);
  const pr = RS.filter((r) => r.paradas[0].hecho && r.paradas[0].salio != null || true).map((r) => { const p = r.paradas[0]; return { r, real: (p.hecho - r.ini) / 60, plan: null }; });
  const dw = P.filter((p) => p.dwell != null).sort((a, b) => b.dwell - a.dwell);
  add('📍', `Tiempo en sede: promedio <b>${Math.round(prom(dw.map((p) => p.dwell)))} min</b>; los más largos ${dw.slice(0, 3).map((p) => `${esc(p.sede)} ${p.dwell} min`).join(', ')}. El plan asumía 15 min por sede.`);
  const rap = RS.filter((r) => r.vmax >= 100 && r.cob >= 30);
  if (rap.length) add('🚦', `Velocidades altas (p95 ≥ 100 km/h): ${rap.map((r) => `<b>${r.id}</b> ${r.vmax} km/h`).join(', ')}. Conviene recordar límites de velocidad con material electoral.`);
  const lej = P.filter((p) => p.dist != null && p.dist > 400);
  add('📏', `${lej.length ? `Marcaron lejos de la sede (>400 m): ${lej.map((p) => `${esc(p.sede)} ${p.dist} m`).join(', ')}.` : 'Todas las entregas se marcaron cerca de su sede.'} Mediana de distancia al marcar: <b>${(() => { const a = P.map((p) => p.dist).filter((x) => x != null).sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; })()} m</b>.`);
  const man = RS.filter((r) => r.manual);
  add('🏁', `<b>${man.length} rutas cerradas por coordinación</b> (no regresaron al CNPRE o no marcaron llegada) y ${16 - man.length} por el motorista. Para la elección: definir si el vehículo debe volver al CNPRE.`);
  const largo = RS.slice().sort((a, b) => (Math.max(...b.paradas.map((p) => p.hecho)) - b.ini) - (Math.max(...a.paradas.map((p) => p.hecho)) - a.ini))[0];
  add('🛻', `La ruta más larga fue <b>${largo.id} (${esc(largo.veh)})</b>: ${dur((Math.max(...largo.paradas.map((p) => p.hecho)) - largo.ini) / 60)} hasta su última sede y ${largo.km} km con GPS.`);

}
function pintarPane() {

  if (tab === 'rut') { const l = SEL ? RS.filter((r) => r.id === SEL).concat(RS.filter((r) => r.id !== SEL)) : RS; p.innerHTML = l.map(rutaCard).join(''); return; }
  if (tab === 'tl') {
    const horas = []; for (let t = G0; t <= G1; t += 3600) horas.push(t);
    p.innerHTML = `<p style="color:var(--ink2);font-size:12.5px;margin:0 0 10px">Cada barra va de la salida al último dato. <b>Negro</b> = en sede · <b>rayado</b> = sin GPS · <span style="color:#12a150">◆</span> = entrega. Tocá una fila para filtrar; tocá la barra para ir a esa hora.</p>
      <div class="gantt" id="gantt">${RS.map((r) => `<div class="gr${SEL === r.id ? ' sel' : ''}" data-r="${r.id}"><span class="n" style="color:${r.col}">${r.id}</span><div class="b">
        <i style="left:${gx(r.ini)};width:calc(${gx(r.t1)} - ${gx(r.ini)});background:${r.col}33"></i>
        ${r.gaps.map((g) => `<i class="gap" style="left:${gx(g[0])};width:calc(${gx(g[1])} - ${gx(g[0])})"></i>`).join('')}
        ${r.paradas.filter((x) => x.lleg != null).map((x) => `<i class="st" style="left:${gx(x.lleg)};width:max(2px,calc(${gx(x.sal)} - ${gx(x.lleg)}))"></i>`).join('')}
        ${r.paradas.map((x) => `<span class="dm" title="${esc(x.sede)} ${hm(x.hecho)}" style="left:${gx(x.hecho)}"></span>`).join('')}</div></div>`).join('')}
        <div class="gph"></div><div class="gax">${horas.filter((_, i) => i % (MOVIL ? 3 : 2) === 0).map((t) => `<span>${hm(t)}</span>`).join('')}</div></div>`;
    frame(T); return;
  }
  if (tab === 'sed') {
    const l = P.filter((x) => !SEL || x.r.id === SEL).sort((a, b) => a.hecho - b.hecho);
    p.innerHTML = `<div class="det"><table class="sedes"><tr><th>Sede</th><th>Ruta</th><th>Entrega</th><th>Atraso</th><th>En sede</th><th>Paq.</th></tr>${l.map((x) => `<tr><td>${esc(x.sede)}${x.nov ? `<div class="nov">${esc(x.nov)}</div>` : ''}</td><td><span class="tag" style="background:${x.r.col}">${x.r.id}</span></td><td><b>${hm(x.hecho)}</b></td><td class="${x.atraso > 15 ? 'pos' : x.atraso < -5 ? 'neg' : ''}">${x.atraso > 0 ? '+' : ''}${x.atraso}</td><td>${x.dwell != null ? x.dwell + ' min' : '—'}</td><td>${x.paqh}/${x.paq}</td></tr>`).join('')}</table></div>`;
  }
}
$('#pane').addEventListener('click', (e) => {
  const g = e.target.closest('.gr');
  if (g) { const b = g.querySelector('.b').getBoundingClientRect(); if (e.target.closest('.b') && SEL === g.dataset.r) { frame(G0 + (e.clientX - b.left) / b.width * (G1 - G0)); return; } elegir(g.dataset.r); return; }
  const c = e.target.closest('.rc'); if (c && !e.target.closest('table')) elegir(c.dataset.r);
});

dibujarTrazas(); dibujarSedes(); pintarPane(); frame(T_MIN); requestAnimationFrame(loop);
reconstruir();
})();
